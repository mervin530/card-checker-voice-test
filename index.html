<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Card Checker Voice Entry</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f6f8;
      color: #202124;
    }

    .page {
      max-width: 520px;
      margin: auto;
      padding: 24px 18px 50px;
    }

    h1 {
      text-align: center;
      margin: 5px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .mic {
      display: block;
      width: 150px;
      height: 150px;
      margin: 20px auto;
      border: none;
      border-radius: 50%;
      background: #1976d2;
      color: white;
      font-size: 60px;
      cursor: pointer;
    }

    .mic.listening {
      background: #d32f2f;
    }

    #status {
      text-align: center;
      font-weight: bold;
      min-height: 30px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .label {
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    #speechText {
      font-size: 19px;
      line-height: 1.4;
    }

    .details {
      display: none;
    }

    .row {
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .field-label {
      color: #777;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .field-value {
      font-size: 20px;
      font-weight: bold;
    }

    .amount {
      font-size: 32px;
    }

    .confirm {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #188038;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .confirm:disabled {
      opacity: 0.65;
    }

    .hint {
      margin-top: 22px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.5;
    }

  </style>

</head>


<body>


<div class="page">


  <h1>
    🎤 Voice Entry
  </h1>


  <div class="subtitle">
    Card Checker
  </div>


  <button
    id="micButton"
    class="mic"
    type="button"
  >
    🎤
  </button>


  <div id="status">
    Tap the microphone
  </div>


  <div class="card">

    <div class="label">
      PHONE HEARD
    </div>

    <div id="speechText">
      —
    </div>

  </div>


  <div
    id="details"
    class="card details"
  >


    <div class="row">

      <div class="field-label">
        Vendor
      </div>

      <div
        id="vendor"
        class="field-value"
      >
        —
      </div>

    </div>


    <div class="row">

      <div class="field-label">
        Amount
      </div>

      <div
        id="amount"
        class="field-value amount"
      >
        —
      </div>

    </div>


    <div class="row">

      <div class="field-label">
        Date
      </div>

      <div
        id="date"
        class="field-value"
      >
        —
      </div>

    </div>


    <div class="row">

      <div class="field-label">
        Type
      </div>

      <div
        id="type"
        class="field-value"
      >
        —
      </div>

    </div>


    <div class="row">

      <div class="field-label">
        Card
      </div>

      <div
        id="card"
        class="field-value"
      >
        —
      </div>

    </div>


  </div>


  <button
    id="confirmButton"
    class="confirm"
    type="button"
  >
    ✓ Confirm & Save
  </button>


  <div class="hint">

    Try saying:

    <br><br>

    <strong>
      Costco, $52.80, food card
    </strong>

    <br><br>

    <strong>
      Costco, $52.80, food card, yesterday
    </strong>

    <br><br>

    <strong>
      Costco, $52.80, food card, September 25
    </strong>

    <br><br>

    or

    <br><br>

    <strong>
      Refund $25 from Costco, food card, September 24
    </strong>

  </div>


</div>



<script>


/************************************************************
 * SPEECH RECOGNITION
 ************************************************************/

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


const micButton =
  document.getElementById(
    'micButton'
  );


const status =
  document.getElementById(
    'status'
  );


const speechText =
  document.getElementById(
    'speechText'
  );


const details =
  document.getElementById(
    'details'
  );


const confirmButton =
  document.getElementById(
    'confirmButton'
  );



if (!SpeechRecognition) {


  status.textContent =
    'Speech recognition is not supported in this browser.';


  micButton.disabled =
    true;


} else {


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    'en-CA';


  recognition.interimResults =
    false;


  recognition.continuous =
    false;


  recognition.maxAlternatives =
    1;



  micButton.addEventListener(
    'click',
    function() {


      speechText.textContent =
        '—';


      details.style.display =
        'none';


      confirmButton.style.display =
        'none';


      status.textContent =
        'Listening...';


      micButton.classList.add(
        'listening'
      );


      try {


        recognition.start();


      } catch (error) {


        status.textContent =
          'Could not start microphone: ' +
          error.message;


      }


    }
  );



  recognition.onresult =
    function(event) {


      const transcript =
        event.results[0][0].transcript;


      speechText.textContent =
        transcript;


      parseVoiceEntry(
        transcript
      );


    };



  recognition.onerror =
    function(event) {


      status.textContent =
        'Microphone error: ' +
        event.error;


    };



  recognition.onend =
    function() {


      micButton.classList.remove(
        'listening'
      );


    };


}



/************************************************************
 * PARSE VOICE ENTRY
 ************************************************************/

function parseVoiceEntry(
  transcript
) {


  const original =
    String(
      transcript || ''
    ).trim();


  const text =
    original.toLowerCase();



  /**********************************************************
   * TRANSACTION TYPE
   **********************************************************/

  let transactionType =
    'PURCHASE';


  if (
    text.includes('refund') ||
    text.includes('return')
  ) {


    transactionType =
      'REFUND';


  }



  /**********************************************************
   * CARD
   **********************************************************/

  let cardLast4 =
    '';


  let cardName =
    'Not recognized';



  if (
    text.includes('food card') ||
    text.includes('food mastercard') ||
    text.includes('9726')
  ) {


    cardLast4 =
      '9726';


    cardName =
      'Food ••••9726';


  }


  else if (
    text.includes('mastercard') ||
    text.includes('main card') ||
    text.includes('3336')
  ) {


    cardLast4 =
      '3336';


    cardName =
      'Costco Mastercard ••••3336';


  }



  /**********************************************************
   * AMOUNT
   **********************************************************/

  let amount =
    null;


  const moneyMatch =
    original.match(
      /\$\s*([0-9]+(?:\.[0-9]{1,2})?)/
    );


  if (moneyMatch) {


    amount =
      Number(
        moneyMatch[1]
      );


  } else {


    const decimalMatch =
      original.match(
        /\b([0-9]+\.[0-9]{1,2})\b/
      );


    if (decimalMatch) {


      amount =
        Number(
          decimalMatch[1]
        );


    }


  }



  /**********************************************************
   * DATE RECOGNITION
   *
   * Supports:
   *
   * today
   * yesterday
   * September 25
   * September 25th
   * Sep 25
   * September 25, 2026
   *
   * If no date is spoken:
   * defaults to today.
   **********************************************************/

  const dateResult =
    parseSpokenDate(
      original
    );


  const purchaseDate =
    dateResult.date;



  /**********************************************************
   * VENDOR
   **********************************************************/

  let vendor =
    original;



  /**********************************************************
   * REMOVE AMOUNT
   **********************************************************/

  vendor =
    vendor.replace(
      /\$\s*[0-9]+(?:\.[0-9]{1,2})?/g,
      ' '
    );



  /**********************************************************
   * REMOVE TRANSACTION WORDS
   **********************************************************/

  vendor =
    vendor.replace(
      /\b(refund|return|purchase|bought|paid|at|from)\b/gi,
      ' '
    );



  /**********************************************************
   * REMOVE CARD WORDS
   **********************************************************/

  vendor =
    vendor.replace(
      /\b(food card|food mastercard|main card|mastercard)\b/gi,
      ' '
    );


  vendor =
    vendor.replace(
      /\b(9726|3336)\b/g,
      ' '
    );



  /**********************************************************
   * REMOVE SPOKEN DATE
   **********************************************************/

  if (
    dateResult.matchedText
  ) {


    vendor =
      vendor.replace(
        dateResult.matchedText,
        ' '
      );


  }



  /**********************************************************
   * CLEAN VENDOR
   **********************************************************/

  vendor =
    vendor.replace(
      /[,]+/g,
      ' '
    );


  vendor =
    vendor.replace(
      /\s+/g,
      ' '
    ).trim();



  /**********************************************************
   * CAPITALIZE VENDOR
   **********************************************************/

  if (vendor) {


    vendor =
      vendor
        .split(' ')
        .map(
          function(word) {


            if (!word) {
              return '';
            }


            return (
              word.charAt(0).toUpperCase() +
              word.slice(1)
            );


          }
        )
        .join(' ');


  }



  /**********************************************************
   * DISPLAY RESULT
   **********************************************************/

  document
    .getElementById(
      'vendor'
    )
    .textContent =
      vendor ||
      'Not recognized';



  document
    .getElementById(
      'amount'
    )
    .textContent =
      amount !== null
        ? '$' +
          amount.toFixed(2)
        : 'Not recognized';



  document
    .getElementById(
      'date'
    )
    .textContent =
      purchaseDate;



  document
    .getElementById(
      'type'
    )
    .textContent =
      transactionType;



  document
    .getElementById(
      'card'
    )
    .textContent =
      cardName;



  details.style.display =
    'block';



  /**********************************************************
   * VALIDATION
   **********************************************************/

  const valid =
    vendor &&
    amount !== null &&
    amount > 0 &&
    cardLast4 &&
    purchaseDate;



  if (valid) {


    status.textContent =
      '✓ Ready to confirm';


    confirmButton.style.display =
      'block';


  } else {


    status.textContent =
      '⚠ Some information was not recognized';


    confirmButton.style.display =
      'none';


  }



  /**********************************************************
   * STORE PARSED ENTRY
   **********************************************************/

  window.voiceEntryTest = {


    purchaseDate:
      purchaseDate,


    vendor:
      vendor,


    amount:
      amount,


    transactionType:
      transactionType,


    cardLast4:
      cardLast4


  };


}



/************************************************************
 * SPOKEN DATE PARSER
 ************************************************************/

function parseSpokenDate(
  transcript
) {


  const original =
    String(
      transcript || ''
    );


  const lower =
    original.toLowerCase();



  /**********************************************************
   * TODAY
   **********************************************************/

  if (
    /\btoday\b/i.test(
      original
    )
  ) {


    const date =
      new Date();


    return {
      date:
        formatLocalDate(
          date
        ),

      matchedText:
        /\btoday\b/i.exec(
          original
        )[0]
    };


  }



  /**********************************************************
   * YESTERDAY
   **********************************************************/

  if (
    /\byesterday\b/i.test(
      original
    )
  ) {


    const date =
      new Date();


    date.setDate(
      date.getDate() - 1
    );


    return {
      date:
        formatLocalDate(
          date
        ),

      matchedText:
        /\byesterday\b/i.exec(
          original
        )[0]
    };


  }



  /**********************************************************
   * MONTH NAMES
   **********************************************************/

  const months = {

    january: 0,
    jan: 0,

    february: 1,
    feb: 1,

    march: 2,
    mar: 2,

    april: 3,
    apr: 3,

    may: 4,

    june: 5,
    jun: 5,

    july: 6,
    jul: 6,

    august: 7,
    aug: 7,

    september: 8,
    sept: 8,
    sep: 8,

    october: 9,
    oct: 9,

    november: 10,
    nov: 10,

    december: 11,
    dec: 11

  };



  /**********************************************************
   * EXAMPLE:
   *
   * September 25
   * September 25th
   * Sep 25
   * September 25, 2026
   **********************************************************/

  const datePattern =
    /\b(january|jan|february|feb|march|mar|april|apr|may|june|jun|july|jul|august|aug|september|sept|sep|october|oct|november|nov|december|dec)\s+([0-9]{1,2})(?:st|nd|rd|th)?(?:,\s*|\s+)?([0-9]{4})?\b/i;


  const match =
    original.match(
      datePattern
    );


  if (match) {


    const monthName =
      match[1].toLowerCase();


    const month =
      months[
        monthName
      ];


    const day =
      Number(
        match[2]
      );


    const today =
      new Date();


    const year =
      match[3]
        ? Number(
            match[3]
          )
        : today.getFullYear();



    /********************************************************
     * VALIDATE DATE
     ********************************************************/

    const date =
      new Date(
        year,
        month,
        day
      );


    if (
      date.getFullYear() === year &&
      date.getMonth() === month &&
      date.getDate() === day
    ) {


      return {

        date:
          formatLocalDate(
            date
          ),

        matchedText:
          match[0]

      };


    }


  }



  /**********************************************************
   * DEFAULT TO TODAY
   **********************************************************/

  return {

    date:
      formatLocalDate(
        new Date()
      ),

    matchedText:
      ''

  };


}



/************************************************************
 * LOCAL DATE FORMATTER
 *
 * Avoids UTC date shifting on phones.
 ************************************************************/

function formatLocalDate(
  date
) {


  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    );


  return (
    year +
    '-' +
    month +
    '-' +
    day
  );


}



/************************************************************
 * CONFIRM & SAVE
 ************************************************************/

confirmButton.addEventListener(
  'click',
  function() {


    const entry =
      window.voiceEntryTest;



    if (
      !entry ||
      !entry.vendor ||
      !entry.amount ||
      !entry.cardLast4 ||
      !entry.purchaseDate
    ) {


      alert(
        'Voice Entry information is incomplete.'
      );


      return;


    }



    /********************************************************
     * GET SAVED PIN OR ASK ON FIRST USE
     ********************************************************/

    let pin =
      localStorage.getItem(
        'cardCheckerVoicePin'
      );



    if (!pin) {


      pin =
        prompt(
          'Enter your Voice Entry PIN:'
        );


      if (!pin) {
        return;
      }


      pin =
        pin.trim();


      localStorage.setItem(
        'cardCheckerVoicePin',
        pin
      );


    }



    /********************************************************
     * COPY DATA INTO HIDDEN FORM
     ********************************************************/

    document
      .getElementById(
        'voiceSavePin'
      )
      .value =
        pin;



    document
      .getElementById(
        'voiceSaveDate'
      )
      .value =
        entry.purchaseDate;



    document
      .getElementById(
        'voiceSaveVendor'
      )
      .value =
        entry.vendor;



    document
      .getElementById(
        'voiceSaveAmount'
      )
      .value =
        entry.amount;



    document
      .getElementById(
        'voiceSaveType'
      )
      .value =
        entry.transactionType;



    document
      .getElementById(
        'voiceSaveCard'
      )
      .value =
        entry.cardLast4;



    /********************************************************
     * SEND TO CARD CHECKER
     ********************************************************/

    status.textContent =
      'Saving...';


    confirmButton.disabled =
      true;



    document
      .getElementById(
        'voiceSaveForm'
      )
      .submit();



    /********************************************************
     * CURRENT TEMPORARY CONFIRMATION
     *
     * Update 3 will replace this with a true backend
     * confirmation containing QE number and match status.
     ********************************************************/

    setTimeout(
      function() {


        status.textContent =
          '✓ Entry sent to Card Checker';


        confirmButton.disabled =
          false;



        alert(
          '✓ Voice Entry sent!\n\n' +
          entry.vendor +
          '\n$' +
          Number(
            entry.amount
          ).toFixed(2) +
          '\n' +
          entry.purchaseDate +
          '\n••••' +
          entry.cardLast4
        );


      },
      700
    );


  }
);


</script>



<!-- CARD CHECKER VOICE SAVE -->


<iframe
  name="voiceSaveFrame"
  id="voiceSaveFrame"
  style="display:none;"
></iframe>



<form
  id="voiceSaveForm"
  method="POST"
  target="voiceSaveFrame"
  action="https://script.google.com/macros/s/AKfycbw4N_YCDBbpLPgn_rocHuJ6fx-L7CQOedwu1XCOaIxMEQ9Lv7JaDHMFUfN_4N3yXASR/exec"
  style="display:none;"
>


  <input
    type="hidden"
    name="pin"
    id="voiceSavePin"
  >


  <input
    type="hidden"
    name="purchaseDate"
    id="voiceSaveDate"
  >


  <input
    type="hidden"
    name="vendor"
    id="voiceSaveVendor"
  >


  <input
    type="hidden"
    name="amount"
    id="voiceSaveAmount"
  >


  <input
    type="hidden"
    name="transactionType"
    id="voiceSaveType"
  >


  <input
    type="hidden"
    name="cardLast4"
    id="voiceSaveCard"
  >


</form>


</body>

</html>
