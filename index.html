<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Card Checker Voice Entry</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f6f8;
      color: #202124;
    }

    .page {
      max-width: 520px;
      margin: auto;
      padding: 24px 18px 50px;
    }

    h1 {
      text-align: center;
      margin: 5px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .mic {
      display: block;
      width: 150px;
      height: 150px;
      margin: 20px auto;
      border: none;
      border-radius: 50%;
      background: #1976d2;
      color: white;
      font-size: 60px;
      cursor: pointer;
    }

    .mic.listening {
      background: #d32f2f;
    }

    #status {
      text-align: center;
      font-weight: bold;
      min-height: 30px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .label {
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    #speechText {
      font-size: 19px;
      line-height: 1.4;
    }

    .details {
      display: none;
    }

    .row {
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .field-label {
      color: #777;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .field-value {
      font-size: 20px;
      font-weight: bold;
    }

    .amount {
      font-size: 32px;
    }

    .confirm {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #188038;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .confirm:disabled {
      opacity: 0.65;
    }

    .hint {
      margin-top: 22px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.5;
    }

    .result-panel {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .result-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .result-body {
      font-size: 16px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .result-actions button {
      flex: 1;
      padding: 14px 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-anyway {
      background: #188038;
      color: white;
    }

    .cancel-duplicate {
      background: #e8eaed;
      color: #202124;
    }

  </style>

</head>


<body>


<div class="page">


  <h1>
    🎤 Voice Entry
  </h1>


  <div class="subtitle">
    Card Checker
  </div>


  <button
    id="micButton"
    class="mic"
    type="button"
  >
    🎤
  </button>


  <div id="status">
    Tap the microphone
  </div>


  <div class="card">

    <div class="label">
      PHONE HEARD
    </div>

    <div id="speechText">
      —
    </div>

  </div>


  <div
    id="details"
    class="card details"
  >


    <div class="row">

      <div class="field-label">
        Vendor
      </div>

      <div
        id="vendor"
        class="field-value"
      >
        —
      </div>

    </div>


    <div class="row">

      <div class="field-label">
        Amount
      </div>

      <div
        id="amount"
        class="field-value amount"
      >
        —
      </div>

    </div>


    <div class="row">

      <div class="field-label">
        Date
      </div>

      <div
        id="date"
        class="field-value"
      >
        —
      </div>

    </div>


    <div class="row">

      <div class="field-label">
        Type
      </div>

      <div
        id="type"
        class="field-value"
      >
        —
      </div>

    </div>


    <div class="row">

      <div class="field-label">
        Card
      </div>

      <div
        id="card"
        class="field-value"
      >
        —
      </div>

    </div>


  </div>


  <button
    id="confirmButton"
    class="confirm"
    type="button"
  >
    ✓ Confirm & Save
  </button>


  <div
    id="resultPanel"
    class="result-panel"
  >
    <div
      id="resultTitle"
      class="result-title"
    ></div>

    <div
      id="resultBody"
      class="result-body"
    ></div>

    <div
      id="duplicateActions"
      class="result-actions"
      style="display:none;"
    >
      <button
        id="cancelDuplicateButton"
        class="cancel-duplicate"
        type="button"
      >
        Cancel
      </button>

      <button
        id="saveAnywayButton"
        class="save-anyway"
        type="button"
      >
        Save Anyway
      </button>
    </div>
  </div>


  <div class="hint">

    Try saying:

    <br><br>

    <strong>
      Costco, $52.80, food card
    </strong>

    <br><br>

    <strong>
      Costco, $52.80, food card, yesterday
    </strong>

    <br><br>

    <strong>
      Costco, $52.80, food card, September 25
    </strong>

    <br><br>

    or

    <br><br>

    <strong>
      Refund $25 from Costco, food card, September 24
    </strong>

  </div>


</div>



<script>


/************************************************************
 * SPEECH RECOGNITION
 ************************************************************/

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


const micButton =
  document.getElementById(
    'micButton'
  );


const status =
  document.getElementById(
    'status'
  );


const speechText =
  document.getElementById(
    'speechText'
  );


const details =
  document.getElementById(
    'details'
  );


const confirmButton =
  document.getElementById(
    'confirmButton'
  );



if (!SpeechRecognition) {


  status.textContent =
    'Speech recognition is not supported in this browser.';


  micButton.disabled =
    true;


} else {


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    'en-CA';


  recognition.interimResults =
    false;


  recognition.continuous =
    false;


  recognition.maxAlternatives =
    1;



  micButton.addEventListener(
    'click',
    function() {


      speechText.textContent =
        '—';


      details.style.display =
        'none';


      confirmButton.style.display =
        'none';


      status.textContent =
        'Listening...';


      micButton.classList.add(
        'listening'
      );


      try {
                recognition.start();

      } catch (error) {

        status.textContent =
          'Could not start microphone.';

        micButton.classList.remove(
          'listening'
        );

      }

    }
  );



  recognition.onresult =
    function(event) {


      const transcript =
        event.results[0][0]
          .transcript
          .trim();


      speechText.textContent =
        transcript;


      parseVoiceEntry(
        transcript
      );

    };



  recognition.onerror =
    function(event) {


      status.textContent =
        'Microphone error: ' +
        event.error;


      micButton.classList.remove(
        'listening'
      );

    };



  recognition.onend =
    function() {


      micButton.classList.remove(
        'listening'
      );


      if (
        status.textContent ===
        'Listening...'
      ) {

        status.textContent =
          'Nothing heard. Try again.';

      }

    };


}



/************************************************************
 * PARSE VOICE ENTRY
 ************************************************************/

function parseVoiceEntry(
  transcript
) {


  const original =
    String(
      transcript || ''
    ).trim();


  const lower =
    original.toLowerCase();



  /**********************************************************
   * TRANSACTION TYPE
   **********************************************************/

  let transactionType =
    'PURCHASE';


  if (
    lower.includes(
      'refund'
    ) ||
    lower.includes(
      'return'
    )
  ) {

    transactionType =
      'REFUND';

  }



  /**********************************************************
   * CARD
   **********************************************************/

  let cardLast4 =
    '';


  let cardName =
    'Not recognized';



  if (
    lower.includes(
      'food card'
    ) ||
    lower.includes(
      'food mastercard'
    ) ||
    lower.includes(
      '9726'
    )
  ) {


    cardLast4 =
      '9726';


    cardName =
      'Food ••••9726';


  } else if (
    lower.includes(
      'main card'
    ) ||
    lower.includes(
      'mastercard'
    ) ||
    lower.includes(
      '3336'
    )
  ) {


    cardLast4 =
      '3336';


    cardName =
      'Costco Mastercard ••••3336';


  }



  /**********************************************************
   * AMOUNT
   **********************************************************/

  let amount =
    null;


  const moneyMatch =
    original.match(
      /\$\s*([0-9]+(?:\.[0-9]{1,2})?)/
    );


  if (moneyMatch) {


    amount =
      Number(
        moneyMatch[1]
      );


  } else {


    const decimalMatch =
      original.match(
        /\b([0-9]+\.[0-9]{1,2})\b/
      );


    if (decimalMatch) {


      amount =
        Number(
          decimalMatch[1]
        );


    }


  }



  /**********************************************************
   * DATE RECOGNITION
   *
   * Supports:
   *
   * today
   * yesterday
   * September 25
   * September 25th
   * Sep 25
   * September 25, 2026
   *
   * If no date is spoken:
   * defaults to today.
   **********************************************************/

  const dateResult =
    parseSpokenDate(
      original
    );


  const purchaseDate =
    dateResult.date;



  /**********************************************************
   * VENDOR
   **********************************************************/

  let vendor =
    original;



  /**********************************************************
   * REMOVE AMOUNT
   **********************************************************/

  vendor =
    vendor.replace(
      /\$\s*[0-9]+(?:\.[0-9]{1,2})?/g,
      ' '
    );



  /**********************************************************
   * REMOVE TRANSACTION WORDS
   **********************************************************/

  vendor =
    vendor.replace(
      /\b(refund|return|purchase|bought|paid|at|from)\b/gi,
      ' '
    );



  /**********************************************************
   * REMOVE CARD WORDS
   **********************************************************/

  vendor =
    vendor.replace(
      /\b(food card|food mastercard|main card|mastercard)\b/gi,
      ' '
    );


  vendor =
    vendor.replace(
      /\b(9726|3336)\b/g,
      ' '
    );



  /**********************************************************
   * REMOVE SPOKEN DATE
   **********************************************************/

  if (
    dateResult.matchedText
  ) {


    vendor =
      vendor.replace(
        dateResult.matchedText,
        ' '
      );


  }



  /**********************************************************
   * CLEAN VENDOR
   **********************************************************/

  vendor =
    vendor.replace(
      /[,]+/g,
      ' '
    );


  vendor =
    vendor.replace(
      /\s+/g,
      ' '
    ).trim();



  /**********************************************************
   * CAPITALIZE VENDOR
   **********************************************************/

  if (vendor) {


    vendor =
      vendor
        .split(' ')
        .map(
          function(word) {


            if (!word) {
              return '';
            }


            return (
              word.charAt(0).toUpperCase() +
              word.slice(1)
            );


          }
        )
        .join(' ');


  }



  /**********************************************************
   * DISPLAY RESULT
   **********************************************************/

  document
    .getElementById(
      'vendor'
    )
    .textContent =
      vendor ||
      'Not recognized';



  document
    .getElementById(
      'amount'
    )
    .textContent =
      amount !== null
        ? '$' +
          amount.toFixed(2)
        : 'Not recognized';



  document
    .getElementById(
      'date'
    )
    .textContent =
      purchaseDate;



  document
    .getElementById(
      'type'
    )
    .textContent =
      transactionType;



  document
    .getElementById(
      'card'
    )
    .textContent =
      cardName;



  details.style.display =
    'block';



  /**********************************************************
   * VALIDATION
   **********************************************************/

  const valid =
    vendor &&
    amount !== null &&
    amount > 0 &&
    cardLast4 &&
    purchaseDate;



  if (valid) {


    status.textContent =
      '✓ Ready to confirm';


    confirmButton.style.display =
      'block';


  } else {


    status.textContent =
      '⚠ Some information was not recognized';


    confirmButton.style.display =
      'none';


  }



  /**********************************************************
   * STORE PARSED ENTRY
   **********************************************************/

  window.voiceEntryTest = {


    purchaseDate:
      purchaseDate,


    vendor:
      vendor,


    amount:
      amount,


    transactionType:
      transactionType,


    cardLast4:
      cardLast4


  };


}



/************************************************************
 * SPOKEN DATE PARSER
 ************************************************************/

function parseSpokenDate(
  transcript
) {


  const original =
    String(
      transcript || ''
    );


  /**********************************************************
   * TODAY
   **********************************************************/

  if (
    /\btoday\b/i.test(
      original
    )
  ) {


    const date =
      new Date();


    return {

      date:
        formatLocalDate(
          date
        ),

      matchedText:
        /\btoday\b/i.exec(
          original
        )[0]

    };


  }



  /**********************************************************
   * YESTERDAY
   **********************************************************/

  if (
    /\byesterday\b/i.test(
      original
    )
  ) {


    const date =
      new Date();


    date.setDate(
      date.getDate() - 1
    );


    return {

      date:
        formatLocalDate(
          date
        ),

      matchedText:
        /\byesterday\b/i.exec(
          original
        )[0]

    };


  }



  /**********************************************************
   * MONTH NAMES
   **********************************************************/

  const months = {

    january: 0,
    jan: 0,

    february: 1,
    feb: 1,

    march: 2,
    mar: 2,

    april: 3,
    apr: 3,

    may: 4,

    june: 5,
    jun: 5,

    july: 6,
    jul: 6,

    august: 7,
    aug: 7,

    september: 8,
    sept: 8,
    sep: 8,

    october: 9,
    oct: 9,

    november: 10,
    nov: 10,

    december: 11,
    dec: 11

  };



  /**********************************************************
   * EXAMPLES:
   *
   * September 25
   * September 25th
   * Sep 25
   * September 25, 2026
   **********************************************************/

  const datePattern =
    /\b(january|jan|february|feb|march|mar|april|apr|may|june|jun|july|jul|august|aug|september|sept|sep|october|oct|november|nov|december|dec)\s+([0-9]{1,2})(?:st|nd|rd|th)?(?:,\s*|\s+)?([0-9]{4})?\b/i;


  const match =
    original.match(
      datePattern
    );


  if (match) {


    const monthName =
      match[1].toLowerCase();


    const month =
      months[
        monthName
      ];


    const day =
      Number(
        match[2]
      );


    const today =
      new Date();


    const year =
      match[3]
        ? Number(
            match[3]
          )
        : today.getFullYear();



    /********************************************************
     * VALIDATE DATE
     ********************************************************/

    const date =
      new Date(
        year,
        month,
        day
      );


    if (
      date.getFullYear() === year &&
      date.getMonth() === month &&
      date.getDate() === day
    ) {


      return {

        date:
          formatLocalDate(
            date
          ),

        matchedText:
          match[0]

      };


    }


  }



  /**********************************************************
   * DEFAULT TO TODAY
   **********************************************************/

  return {

    date:
      formatLocalDate(
        new Date()
      ),

    matchedText:
      ''

  };


}



/************************************************************
 * LOCAL DATE FORMATTER
 *
 * Avoids UTC date shifting on phones.
 ************************************************************/

function formatLocalDate(
  date
) {


  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    );


  return (
    year +
    '-' +
    month +
    '-' +
    day
  );


}



/************************************************************
 * CONFIRM & SAVE
 ************************************************************/

const resultPanel =
  document.getElementById(
    'resultPanel'
  );


const resultTitle =
  document.getElementById(
    'resultTitle'
  );


const resultBody =
  document.getElementById(
    'resultBody'
  );


const duplicateActions =
  document.getElementById(
    'duplicateActions'
  );


const saveAnywayButton =
  document.getElementById(
    'saveAnywayButton'
  );


const cancelDuplicateButton =
  document.getElementById(
    'cancelDuplicateButton'
  );


let activeVoiceNonce =
  '';


let pendingDuplicateEntry =
  null;


confirmButton.addEventListener(
  'click',
  function() {


    submitVoiceEntry(
      false
    );


  }
);


/************************************************************
 * SUBMIT VOICE ENTRY
 ************************************************************/

function submitVoiceEntry(
  allowDuplicate
) {


  const entry =
    window.voiceEntryTest;


  if (
    !entry ||
    !entry.vendor ||
    !entry.amount ||
    !entry.cardLast4 ||
    !entry.purchaseDate
  ) {


    alert(
      'Voice Entry information is incomplete.'
    );


    return;


  }


  /**********************************************************
   * GET SAVED PIN OR ASK ON FIRST USE
   **********************************************************/

  let pin =
    localStorage.getItem(
      'cardCheckerVoicePin'
    );


  if (!pin) {


    pin =
      prompt(
        'Enter your Voice Entry PIN:'
      );


    if (!pin) {
      return;
    }


    pin =
      pin.trim();


    localStorage.setItem(
      'cardCheckerVoicePin',
      pin
    );


  }


  /**********************************************************
   * CREATE REQUEST NONCE
   **********************************************************/

  activeVoiceNonce =
    createVoiceNonce();


  /**********************************************************
   * COPY DATA INTO HIDDEN FORM
   **********************************************************/

  document
    .getElementById(
      'voiceSavePin'
    )
    .value =
      pin;


  document
    .getElementById(
      'voiceSaveDate'
    )
    .value =
      entry.purchaseDate;


  document
    .getElementById(
      'voiceSaveVendor'
    )
    .value =
      entry.vendor;


  document
    .getElementById(
      'voiceSaveAmount'
    )
    .value =
      entry.amount;


  document
    .getElementById(
      'voiceSaveType'
    )
    .value =
      entry.transactionType;


  document
    .getElementById(
      'voiceSaveCard'
    )
    .value =
      entry.cardLast4;


  document
    .getElementById(
      'voiceSaveNonce'
    )
    .value =
      activeVoiceNonce;


  document
    .getElementById(
      'voiceSaveAllowDuplicate'
    )
    .value =
      allowDuplicate
        ? 'true'
        : 'false';


  /**********************************************************
   * SEND TO CARD CHECKER
   **********************************************************/

  status.textContent =
    allowDuplicate
      ? 'Saving duplicate entry...'
      : 'Saving...';


  confirmButton.disabled =
    true;


  saveAnywayButton.disabled =
    true;


  duplicateActions.style.display =
    'none';


  resultPanel.style.display =
    'none';


  document
    .getElementById(
      'voiceSaveForm'
    )
    .submit();


}
  /************************************************************
 * RECEIVE REAL BACKEND RESULT
 ************************************************************/

window.addEventListener(
  'message',
  function(event) {


    const data =
      event.data;


    if (
      !data ||
      typeof data !== 'object'
    ) {

      return;

    }


    /********************************************************
     * ONLY ACCEPT RESPONSE FOR CURRENT REQUEST
     ********************************************************/

    if (
      !activeVoiceNonce ||
      data.nonce !== activeVoiceNonce
    ) {

      return;

    }


    /********************************************************
     * CONSUME NONCE
     *
     * Prevent the same iframe response from being handled
     * more than once.
     ********************************************************/

    activeVoiceNonce =
      '';


    confirmButton.disabled =
      false;


    saveAnywayButton.disabled =
      false;



    /********************************************************
     * DUPLICATE
     ********************************************************/

    if (
      data.status === 'DUPLICATE' ||
      data.isDuplicate === true
    ) {


      showDuplicateResult(
        data
      );


      return;


    }



    /********************************************************
     * SAVED
     ********************************************************/

    if (
      data.success === true &&
      data.saved === true &&
      data.status === 'SAVED'
    ) {


      showSavedResult(
        data
      );


      return;


    }



    /********************************************************
     * ERROR
     ********************************************************/

    showVoiceError(
      data.error ||
      data.message ||
      'Unable to save Voice Entry.'
    );


  }
);



/************************************************************
 * DISPLAY SAVED RESULT
 ************************************************************/

function showSavedResult(
  data
) {


  pendingDuplicateEntry =
    null;


  status.textContent =
    '✓ Saved successfully';


  resultTitle.textContent =
    '✅ Saved Successfully';


  const lines =
    [];


  /**********************************************************
   * QUICK ENTRY NUMBER
   **********************************************************/

  if (
    data.entryId
  ) {


    lines.push(
      data.entryId
    );


  }



  /**********************************************************
   * VENDOR + AMOUNT
   **********************************************************/

  lines.push(

    String(
      data.vendor || ''
    ) +

    ' — $' +

    Number(
      data.amount || 0
    ).toFixed(2)

  );



  /**********************************************************
   * DATE
   **********************************************************/

  lines.push(

    formatDisplayDate(
      data.purchaseDate
    )

  );



  /**********************************************************
   * CARD
   **********************************************************/

  lines.push(

    getCardDisplayName(
      data.cardLast4
    )

  );



  /**********************************************************
   * MATCH STATUS
   **********************************************************/

  if (
    data.matchStatus
  ) {


    lines.push(

      'Statement: ' +

      formatMatchStatus(
        data.matchStatus
      )

    );


  }



  /**********************************************************
   * MATCHED TRANSACTION
   **********************************************************/

  if (
    data.matchedTransactionId
  ) {


    lines.push(

      'Matched: ' +
      data.matchedTransactionId

    );


  }



  /**********************************************************
   * CONFIDENCE
   **********************************************************/

  if (
    data.confidence !== '' &&
    data.confidence !== null &&
    data.confidence !== undefined
  ) {


    lines.push(

      'Confidence: ' +
      data.confidence +
      '%'

    );


  }



  resultBody.textContent =
    lines.join(
      '\n'
    );


  duplicateActions.style.display =
    'none';


  resultPanel.style.display =
    'block';


}



/************************************************************
 * DISPLAY DUPLICATE RESULT
 ************************************************************/

function showDuplicateResult(
  data
) {


  pendingDuplicateEntry =
    data.duplicate ||
    null;


  status.textContent =
    '⚠ Possible duplicate';


  resultTitle.textContent =
    '⚠️ Possible Duplicate';



  const duplicate =
    data.duplicate ||
    {};


  const lines =
    [];



  /**********************************************************
   * EXISTING QUICK ENTRY NUMBER
   **********************************************************/

  if (
    duplicate.entryId
  ) {


    lines.push(

      'Already entered as ' +
      duplicate.entryId

    );


  }



  /**********************************************************
   * VENDOR + AMOUNT
   **********************************************************/

  lines.push(

    String(

      duplicate.vendor ||

      (
        window.voiceEntryTest
          ? window.voiceEntryTest.vendor
          : ''
      )

    ) +

    ' — $' +

    Number(

      duplicate.amount ||

      (
        window.voiceEntryTest
          ? window.voiceEntryTest.amount
          : 0
      )

    ).toFixed(2)

  );



  /**********************************************************
   * DATE
   **********************************************************/

  lines.push(

    formatDisplayDate(

      duplicate.purchaseDate ||

      (
        window.voiceEntryTest
          ? window.voiceEntryTest.purchaseDate
          : ''
      )

    )

  );



  /**********************************************************
   * CARD
   **********************************************************/

  lines.push(

    getCardDisplayName(

      duplicate.cardLast4 ||

      (
        window.voiceEntryTest
          ? window.voiceEntryTest.cardLast4
          : ''
      )

    )

  );



  resultBody.textContent =
    lines.join(
      '\n'
    );


  duplicateActions.style.display =
    'flex';


  resultPanel.style.display =
    'block';


}



/************************************************************
 * SAVE ANYWAY
 ************************************************************/

saveAnywayButton.addEventListener(
  'click',
  function() {


    if (
      !pendingDuplicateEntry
    ) {

      return;

    }


    submitVoiceEntry(
      true
    );


  }
);



/************************************************************
 * CANCEL DUPLICATE
 ************************************************************/

cancelDuplicateButton.addEventListener(
  'click',
  function() {


    pendingDuplicateEntry =
      null;


    duplicateActions.style.display =
      'none';


    resultPanel.style.display =
      'none';


    status.textContent =
      'Duplicate not saved';


    confirmButton.disabled =
      false;


  }
);



/************************************************************
 * DISPLAY ERROR
 ************************************************************/

function showVoiceError(
  message
) {


  status.textContent =
    '✕ Save failed';


  resultTitle.textContent =
    '❌ Unable to Save';


  resultBody.textContent =
    String(

      message ||
      'Unable to save Voice Entry.'

    );


  duplicateActions.style.display =
    'none';


  resultPanel.style.display =
    'block';


}



/************************************************************
 * NONCE
 ************************************************************/

function createVoiceNonce() {


  return (

    'voice_' +

    Date.now() +

    '_' +

    Math.random()
      .toString(36)
      .slice(2)

  );


}



/************************************************************
 * CARD DISPLAY NAME
 ************************************************************/

function getCardDisplayName(
  last4
) {


  const value =
    String(
      last4 || ''
    );


  if (
    value === '9726'
  ) {


    return (
      'Food ••••9726'
    );


  }


  if (
    value === '3336'
  ) {


    return (
      'Costco Mastercard ••••3336'
    );


  }


  if (
    value === '8386'
  ) {


    return (
      'Costco Mastercard ••••8386'
    );


  }


  return (
    'Card ••••' +
    value
  );


}



/************************************************************
 * MATCH STATUS DISPLAY
 ************************************************************/

function formatMatchStatus(
  value
) {


  const statusValue =
    String(
      value || ''
    )
      .trim()
      .toUpperCase();


  if (
    statusValue === 'MATCHED'
  ) {

    return 'Matched';

  }


  if (
    statusValue === 'POSSIBLE_MATCH'
  ) {

    return 'Possible Match';

  }


  if (
    statusValue === 'UNMATCHED'
  ) {

    return 'Unmatched';

  }


  if (
    statusValue === 'REVIEW'
  ) {

    return 'Review';

  }


  return (
    statusValue ||
    'Unmatched'
  );


}



/************************************************************
 * DISPLAY DATE
 ************************************************************/

function formatDisplayDate(
  value
) {


  const text =
    String(
      value || ''
    ).trim();


  const match =
    text.match(
      /^([0-9]{4})-([0-9]{2})-([0-9]{2})$/
    );


  if (
    !match
  ) {

    return text;

  }


  const date =
    new Date(

      Number(
        match[1]
      ),

      Number(
        match[2]
      ) - 1,

      Number(
        match[3]
      )

    );


  return date.toLocaleDateString(
    'en-CA',
    {

      year:
        'numeric',

      month:
        'long',

      day:
        'numeric'

    }
  );


}
